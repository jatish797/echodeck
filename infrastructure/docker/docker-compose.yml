version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: echodeck-postgres
    restart: always
    environment:
      POSTGRES_USER: echodeck
      POSTGRES_PASSWORD: echodeck_password
      POSTGRES_DB: echodeck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: echodeck-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
